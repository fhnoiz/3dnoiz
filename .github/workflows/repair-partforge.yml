name: Repair PartForge Local Build
on:
  push:
    paths:
      - ".github/workflows/assemble-partforge-local.yml"
      - "partforge/_build/READY"
      - ".github/workflows/repair-partforge.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract generated files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          source = Path(".github/workflows/assemble-partforge-local.yml").read_text(encoding="utf-8")

          def extract(name, marker):
              start = "cat > partforge/" + name + " <<'" + marker + "'"
              i = source.find(start)
              if i < 0:
                  raise SystemExit("No se encontró el bloque " + name)
              i = source.find("\n", i) + 1
              j = source.find("\n" + marker, i)
              if j < 0:
                  raise SystemExit("No se encontró el cierre " + name)
              return source[i:j] + "\n"

          index = extract("index.html", "EOF_INDEX")
          js = extract("free.js", "EOF_JS")

          if "<title>PartForge 3D" not in index:
              raise SystemExit("index inválido")
          if "function generate" not in js:
              raise SystemExit("free.js inválido")
          if any(x in index.lower() for x in ["meshy","tripo","api.m"]):
              raise SystemExit("El index contiene proveedor de IA")
          if any(x in js.lower() for x in ["meshy","tripo","api.m"]):
              raise SystemExit("El JS contiene proveedor de IA")

          Path("partforge/index.html").write_text(index, encoding="utf-8")
          Path("partforge/free.js").write_text(js, encoding="utf-8")
          Path("partforge/manifest.json").write_text(json.dumps({
              "name":"PartForge 3D Local Free","short_name":"PartForge",
              "start_url":"./index.html","display":"standalone",
              "background_color":"#070a10","theme_color":"#8d72ff","lang":"es-CL"
          },ensure_ascii=False,indent=2),encoding="utf-8")
          Path("partforge/README.md").write_text(
              "# PartForge 3D — Local Free\n\n"
              "Creación y edición 3D gratuita en el navegador. "
              "Sin Meshy, Tripo, créditos de IA ni claves API.\n\n"
              "Imagen → 3D usa reconstrucción geométrica local basada en las vistas disponibles. "
              "La malla, selección, separación, uniones y exportaciones se procesan en el navegador.\n",
              encoding="utf-8")
          PY
          rm -f partforge/app.js
          rm -rf partforge/_build
      - name: Publish
        shell: bash
        run: |
          git config user.name "PartForge Local Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A partforge .github/workflows/assemble-partforge-local.yml .github/workflows/repair-partforge.yml
          git commit -m "Publish PartForge Local Free" || exit 0
          git push
