name: Repair PartForge Local Build
on:
  push:
    paths:
      - ".github/workflows/assemble-partforge-local.yml"
      - "partforge/_build/READY"
      - ".github/workflows/repair-partforge.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract generated files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          source = Path(".github/workflows/assemble-partforge-local.yml").read_text(encoding="utf-8")

          a = source.find("cat > partforge/index.html <<'EOF_INDEX'")
          if a < 0: raise SystemExit("index start missing")
          a = source.find("\n", a) + 1
          b = source.find("\nEOF_INDEX", a)
          if b < 0: raise SystemExit("index end missing")
          index = source[a:b] + "\n"

          a = source.find("cat > partforge/free.js <<'EOF_JS'")
          if a < 0: raise SystemExit("js start missing")
          a = source.find("\n", a) + 1
          js = source[a:].rstrip() + "\n"

          if "<title>PartForge 3D" not in index: raise SystemExit("index invalid")
          if "function generate" not in js: raise SystemExit("js invalid")
          for bad in ("https://api.meshy.ai","https://api.tripo.ai","/openapi/v1","apiKey="):
              if bad.lower() in index.lower() or bad.lower() in js.lower():
                  raise SystemExit("external API reference found: "+bad)

          Path("partforge/index.html").write_text(index,encoding="utf-8")
          Path("partforge/free.js").write_text(js,encoding="utf-8")
          Path("partforge/manifest.json").write_text(json.dumps({
            "name":"PartForge 3D Local Free","short_name":"PartForge",
            "start_url":"./index.html","display":"standalone",
            "background_color":"#070a10","theme_color":"#8d72ff","lang":"es-CL"
          },ensure_ascii=False,indent=2),encoding="utf-8")
          Path("partforge/README.md").write_text(
            "# PartForge 3D — Local Free\n\n"
            "Creación y edición 3D gratuita. Sin Meshy, Tripo, créditos ni API keys.\n\n"
            "Imagen → 3D usa reconstrucción geométrica local; la edición y exportación se realizan en el navegador.\n",
            encoding="utf-8")
          PY
          rm -f partforge/app.js
          rm -rf partforge/_build
      - name: Publish
        shell: bash
        run: |
          git config user.name "PartForge Local Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A partforge .github/workflows/assemble-partforge-local.yml .github/workflows/repair-partforge.yml
          git commit -m "Publish PartForge Local Free" || exit 0
          git push
