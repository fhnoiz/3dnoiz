name: Validate PartForge Latest
on:
  push:
    paths:
      - "partforge/free.js"
      - "partforge/index.html"
      - "partforge/triposr-webgpu.js"
      - "partforge/smoke-test.mjs"
      - ".github/workflows/validate-partforge-latest.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: |
          node --check partforge/free.js
          node --check partforge/triposr-webgpu.js

      - name: No paid AI APIs
        shell: bash
        run: |
          ! grep -Eiq 'api\.meshy\.ai|api\.tripo\.ai|/openapi/v1|apiKey[[:space:]]*=' partforge/free.js partforge/index.html

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Browser smoke test
        shell: bash
        run: |
          python3 -m http.server 4173 --directory . >/tmp/partforge-http.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          node partforge/smoke-test.mjs
