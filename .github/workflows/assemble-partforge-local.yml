-radius:10px;padding:8px 10px;font-size:12px}.parts{display:flex;flex-direction:column;gap:6px}.part{padding:10px;background:#0b1018;border:1px solid var(--line);border-radius:10px;text-align:left;color:#dce5f3}.part.active{border-color:#917eff}.small{font-size:12px;color:var(--muted)}.btns{display:grid;grid-template-columns:1fr 1fr;gap:7px}.btns button{padding:9px}.primary,.secondary,.ghost,.danger{border-radius:10px;padding:10px 12px}.danger{background:#231114;color:#ffb4bb;border:1px solid #54252c}.full{width:100%}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:50;padding:20px}.modalCard{max-width:640px;width:min(100%,640px);background:#0d121b;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 30px 100px #000a}.modalCard h3{margin:0 0 12px}.modalHead{display:flex;justify-content:space-between;align-items:center}.close{background:#131925;border:1px solid var(--line);color:#fff;border-radius:9px;padding:6px 10px}.status{position:fixed;bottom:0;left:0;right:0;padding:9px 15px;background:#080c12df;border-top:1px solid var(--line);font-size:12px;color:#b7c0d0;display:flex;justify-content:space-between;z-index:21}.tooltip{position:fixed;background:#080c12;color:#dfe6f4;border:1px solid #364255;padding:8px 10px;border-radius:8px;font-size:12px;z-index:100;pointer-events:none;display:none;max-width:280px}.donate{border:1px solid #3a4c3f;background:#0d1813;padding:12px;border-radius:12px;color:#bdd3c2}.statrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1c2532}.statrow:last-child{border-bottom:0}@media(max-width:1100px){.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.editor{grid-template-columns:240px 1fr}.right{display:none}}@media(max-width:760px){.top{padding:0 12px}.topActions{display:none}.nav button{padding:8px}.views{grid-template-columns:1fr 1fr}.editor{grid-template-columns:1fr}.side{display:none}.wrap{padding:2