name: Assemble PartForge Local
on:
  push:
    paths:
      - "partforge/_build/READY"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble compressed local build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, shutil

          root = Path("partforge/_build")

          def unpack(src, dst):
              text = ''.join((root / src).read_text().split())
              text += '=' * ((4 - len(text) % 4) % 4)
              print(f"Decoding {src}: {len(text)} base64 chars")
              raw = base64.b64decode(text)
              print(f"Decoded {src}: {len(raw)} bytes")
              data = gzip.decompress(raw)
              print(f"Decompressed {src}: {len(data)} bytes -> {dst}")
              (Path("partforge") / dst).write_bytes(data)

          for src, dst in [
              ("free.js.gz.b64", "free.js"),
              ("index.html.gz.b64", "index.html"),
              ("manifest.json.gz.b64", "manifest.json"),
              ("README.md.gz.b64", "README.md"),
          ]:
              unpack(src, dst)

          old = Path("partforge/app.js")
          if old.exists():
              old.unlink()

          shutil.rmtree(root)
          PY

      - name: Publish assembled files
        shell: bash
        run: |
          git config user.name "PartForge Local Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add partforge
          git commit -m "Build PartForge Local Free edition" || exit 0
          git push
