<body>
<header class="top">
  <div class="brand"><div class="logo">P3</div><div><b>PartForge 3D</b><small>LOCAL · GRATIS · PRINT READY</small></div></div>
  <nav class="nav"><button class="navb active" data-page="home">Inicio</button><button class="navb" data-page="image">Imagen → 3D</button><button class="navb" data-page="editor">Editor 3D</button></nav>
  <div class="topActions"><button class="secondary" id="donateTop" data-tip="Apoya el proyecto de forma voluntaria">❤️ Apoyar</button><button class="primary" id="loadTop" data-tip="Carga un modelo 3D desde tu computador">Cargar 3D</button></div>
</header>
<main class="pages">
<section id="page-home" class="page active"><div class="wrap">
  <div class="hero"><span class="eyebrow">PARTFORGE LOCAL</span><h1>Herramientas 3D para crear, separar y preparar modelos sin créditos.</h1><p>Todo el procesamiento de creación y edición se ejecuta localmente. No se conecta a Meshy, Tripo ni a una API de generación 3D de pago.</p></div>
  <div class="notice"><b>Gratis para todos:</b> el botón de apoyo es opcional y no desbloquea funciones.</div>
  <div class="cards">
    <div class="card"><span class="eyebrow">01</span><h3>Imagen → 3D</h3><p>Usa 1 a 4 vistas del mismo objeto. PartForge reconstruye un volumen local a partir de las siluetas y puede asignar colores.</p><button class="primary full" data-page="image">Abrir</button></div>
    <div class="card"><span class="eyebrow">02</span><h3>Multicolor</h3><p>Detecta colores de la imagen, agrupa superficies y crea piezas separadas listas para trabajar en impresión multicolor.</p><button class="secondary full" data-page="image">Abrir</button></div>
    <div class="card"><span class="eyebrow">03</span><h3>Separación precisa</h3><p>Selecciona regiones con Smart, pincel, lazo, trazo o color y conviértelas en piezas independientes.</p><button class="secondary full" data-page="editor">Abrir</button></div>
    <div class="card"><span class="eyebrow">04</span><h3>Encajes</h3><p>Crea uniones macho/hembra, pines o alojamientos para imanes con diámetro, profundidad y holgura configurables.</p><button class="secondary full" data-page="editor">Abrir</button></div>
  </div>
  <div class="panel" style="margin-top:18px"><h3>Qué es local y qué es externo</h3><div class="statrow"><span>Generación desde imágenes</span><b>Local</b></div><div class="statrow"><span>Detección de colores</span><b>Local</b></div><div class="statrow"><span>Selección y separación</span><b>Local</b></div><div class="statrow"><span>Exportación</span><b>Local</b></div><div class="statrow"><span>IA de terceros</span><b>Ninguna</b></div></div>
</div></section>

<section id="page-image" class="page"><div class="wrap">
<div class="grid2">
<div class="panel"><span class="eyebrow">IMAGEN → 3D</span><h2>Reconstrucción local</h2><p class="small">Para formas complejas, las 4 vistas reducen ambigüedad. La reconstrucción local no puede inventar partes que ninguna fotografía muestra.</p>
<div class="views" id="views"></div>
<div class="row" style="margin-top:12px"><button class="secondary" id="addImages" data-tip="Añade hasta cuatro fotografías del mismo objeto">＋ Añadir vistas</button><button class="ghost" id="clearImages">Limpiar</button><input id="imageInput" type="file" accept="image/*" multiple hidden></div>
</div>
<div class="panel"><h3>Configuración</h3>
<div class="field"><label>Modo de color</label><div class="choiceRow"><button class="choice active" data-mode="single">Una pieza / un color</button><button class="choice" data-mode="multi">Multicolor / varias piezas</button></div></div>
<div class="field"><label>Resolución local</label><select id="quality"><option value="normal">Normal</option><option value="high">Alta</option><option value="ultra">Ultra</option></select></div>
<div class="field"><label>Altura aproximada (mm)</label><input id="heightMm" type="number" min="5" max="300" value="50"></div>
<div id="multiBox" class="hidden"><div class="field"><label>Máximo de colores</label><select id="maxColors"><option>3</option><option selected>4</option><option>6</option><option>8</option></select></div><div class="row"><button class="secondary" id="analyze">Analizar colores</button><button class="ghost" id="addColor">＋ Color</button></div><div id="palette" class="palette" style="margin-top:9px"></div></div>
<button class="primary full" id="generate" data-tip="Construye el volumen 3D localmente sin enviar imágenes a ningún servicio">Crear modelo 3D</button>
</div></div>
<div class="panel" style="margin-top:18px"><h3>Resultado</h3><div id="genInfo" class="small">Aún no se ha creado un modelo.</div><div class="row" style="margin-top:10px"><button class="primary" id="openGenerated">Abrir en editor</button><button class="secondary" id="saveGenerated">Guardar archivo</button></div></div>
</div></section>

<section id="page-editor" class="page"><div class="editor">
<aside class="side">
<span class="eyebrow">SELECCIÓN</span>
<button class="tool active" data-tool="object" data-tip="Selecciona una pieza completa">◫ Objeto</button>
<button class="tool" data-tool="smart" data-tip="Selecciona una región conectada cerca del punto elegido">✦ Smart region</button>
<button class="tool" data-tool="brush" data-tip="Selecciona caras alrededor del punto elegido">◉ Pincel</button>
<button class="tool" data-tool="lasso" data-tip="Dibuja un lazo en la vista para seleccionar caras proyectadas">⌁ Lazo</button>
<button class="tool" data-tool="trace" data-tip="Trazo guiado para seleccionar una zona cercana">／ Trazo</button>
<button class="tool" data-tool="color" data-tip="Selecciona caras con un color parecido">◈ Por color</button>
<div class="field"><label>Radio pincel</label><input id="brush" type="range" min="2" max="80" value="18"></div>
<div class="field"><label>Ángulo Smart</label><input id="angle" type="range" min="5" max="85" value="30"></div>
<div class="field"><label>Tolerancia color</label><input id="tol" type="range" min="2" max="100" value="28"></div>
<div class="btns"><button class="secondary" id="addSel">＋ Añadir</button><button class="secondary" id="subSel">− Quitar</button><button class="secondary" id="invertSel">Invertir</button><button class="danger" id="clearSel">Limpiar</button></div>
<hr style="border-color:#202b39;border-style:solid;border-width:1px 0 0;margin:14px 0">
<span class="eyebrow">SEPARAR</span>
<button class="primary full" id="detach" data-tip="Convierte la selección actual en una pieza independiente">Separar pieza</button>
<button class="secondary full" id="split" data-tip="Divide la pieza por componentes de conectividad facial">Separar por componentes</button>
<label class="small" style="display:flex;gap:8px;margin-top:9px"><input id="cap" type="checkbox" checked> Intentar cerrar el corte</label>
</aside>
<section class="viewer" id="viewer"><div class="bar"><div class="pills" id="meshInfo">Sin modelo</div><div class="row"><button class="ghost" id="front">Frente</button><button class="ghost" id="top">Arriba</button><button class="ghost" id="side">Lado</button><button class="ghost" id="frame">Enmarcar</button><button class="ghost" id="wire">Malla</button><button class="ghost" id="xray">X-Ray</button></div></div></section>
<aside class="side right">
<button class="primary full" id="loadEditor">Cargar 3D</button><input id="modelInput" type="file" accept=".stl,.obj,.glb,.gltf" hidden>
<div style="margin-top:15px"><span class="eyebrow">PIEZAS</span><div class="parts" id="parts"></div></div>
<div class="field"><label>Nombre</label><input id="partName" type="text" placeholder="Pieza"></div>
<div class="btns"><button class="secondary" id="solo">Solo</button><button class="secondary" id="hide">Ocultar</button><button class="secondary" id="dup">Duplicar</button><button class="danger" id="del">Eliminar</button></div>
<hr style="border-color:#202b39;border-style:solid;border-width:1px 0 0;margin:14px 0">
<span class="eyebrow">UNIÓN</span>
<div class="field"><label>Tipo</label><select id="joint"><option value="cylinder">Cilindro</option><option value="cube">Cuadrado</option><option value="magnet">Imán</option></select></div>
<div class="field"><label>Diámetro / ancho</label><input id="jointSize" type="number" value="4" min="0.8" step="0.1"></div>
<div class="field"><label>Profundidad</label><input id="jointDepth" type="number" value="3" min="0.5" step="0.1"></div>
<div class="field"><label>Holgura</label><input id="jointGap" type="number" value="0.15" min="0" step="0.01"></div>
<button class="secondary full" id="makeJoint" data-tip="Crea un macho y un alojamiento correspondiente usando operaciones locales">Crear unión</button>
<hr style="border-color:#202b39;border-style:solid;border-width:1px 0 0;margin:14px 0">
<span class="eyebrow">EXPORTAR</span>
<div class="btns"><button class="secondary" id="expStl">STL</button><button class="secondary" id="expObj">OBJ</button><button class="secondary" id="exp3mf">3MF</button><button class="secondary" id="expJson">Proyecto</button></div>
<button class="secondary full" id="repair" style="margin-top:8px">Analizar impresión</button>
</aside>
</div></section>
</main>

<div id="progressModal" class="modal hidden"><div class="modalCard"><div class="modalHead"><h3 id="progressTitle">Procesando localmente</h3><button class="close" id="progressClose">×</button></div><p id="progressMsg" class="small">Preparando…</p><div style="height:8px;background:#161d28;border-radius:20px;overflow:hidden"><div id="progressBar" style="height:100%;width:0;background:linear-gradient(90deg,#7b66ff,#45c5ff)"></div></div></div></div>
<div id="reportModal" class="modal hidden"><div class="modalCard"><div class="modalHead"><h3>Analizar impresión</h3><button class="close" data-close="reportModal">×</button></div><pre id="report" style="white-space:pre-wrap;color:#cbd4e2;font:13px/1.5 system-ui"></pre></div></div>
<div id="donateModal" class="modal hidden"><div class="modalCard"><div class="modalHead"><h3>Apoyar PartForge 3D</h3><button class="close" data-close="donateModal">×</button></div><div class="donate">El proyecto es gratuito. Puedes apoyar de forma voluntaria. El botón de donación se puede conectar después a la cuenta o enlace que tú elijas.</div></div></div>
<div id="bootError" class="modal hidden"><div class="modalCard"><h3>PartForge no terminó de cargar</h3><p class="small" id="bootText">Revisa la consola del navegador.</p><button class="secondary" onclick="location.reload()">Recargar</button></div></div>
<div id="tip" class="tooltip"></div><div class="status"><span id="statusText">Listo.</span><span id="statusProgress"></span></div>
<script type="module" src="./free.js?v=local-v4"></script>
</body>
</html>
EOF_INDEX

cat > partforge/free.js <<'EOF_JS'
const $ = (id) => document.getElementById(id);
const $$ = (sel) => [...document.querySelectorAll(sel)];
const S = {page:"home",mode:"single",images:[],palette:[],generated:null,three:null,Orbit:null,scene:null,camera:null,renderer:null,controls:null,parts:[],active:null,tool:"object",selected:new Map(),addMode:"replace",brush:18,angle:30,tol:28,wire:false,xray:false,lastHit:null,liso:[]};

function toast(msg,type="info"){ $("statusText").textContent=msg; setTimeout(()=>{if($("statusText").textContent===msg)$("statusText").textContent="Listo.";},4200); }
function status(msg,p=""){ $("statusText").textContent=msg; $("statusProgress").textContent=p; }
function modal(id,on){ $(id).classList.toggle("hidden",!on); }
function page(p){ S.page=p; $$(".page").forEach(x=>x.classList.remove("active")); $("page-"+p).classList.add("active"); $$(".navb").forEach(b=>b.classList.toggle("active",b.dataset.page===p)); if(p==="editor")setTimeout(resize,50); }
function tipInit(){const t=$("tip");$$("[data-tip]").forEach(n=>{n.addEventListener("mouseenter",()=>{t.textContent=n.dataset.tip;t.style.display="block";const r=n.getBoundingClientRect();t.style.left=Math.min(innerWidth-290,Math.max(8,r.left))+"px";t.style.top=(r.bottom+8)+"px";});n.addEventListener("mouseleave",()=>t.style.display="none");});}
function closeModalEvents(){ $$("[data-close]").forEach(b=>b.onclick=()=>modal(b.dataset.close,false)); $("progressClose").onclick=()=>modal("progressModal",false); }

function fileURL(file){return URL.createObjectURL(file);}
async function fileData(file){return await new Promise((ok,err)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=err;r.readAsDataURL(file);});}
async function addImages(files){const f=[...files].filter(x=>x.type.startsWith("image/")).slice(0,4-S.images.length);for(const file of f)S.images.push({file,url:fileURL(file),data:await fileData(file)});renderViews();if(S.mode==="multi"&&!S.palette.length)analyzePalette();}
function renderViews(){const box=$("views"),names=["Frente","Izquierda","Atrás","Derecha"];box.innerHTML="";for(let i=0;i<4;i++){const d=document.createElement("div");d.className="slot";if(S.images[i]){d.innerHTML="<img src=\""+S.images[i].url+"\" alt=\""+names[i]+"\"><span>"+names[i]+"</span><button class=\"x\">×</button>";d.querySelector(".x").onclick=(e)=>{e.stopPropagation();URL.revokeObjectURL(S.images[i].url);S.images.splice(i,1);renderViews();};}else{d.innerHTML="<div class=\"plus\">＋</div><b>"+names[i]+"</b>";d.onclick=()=>$("imageInput").click();}box.appendChild(d);}}
function hexToRgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function rgbHex(r,g,b){return "#"+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,"0")).join("")}
function nearestName(h){const refs=[["Rojo","#e53935"],["Naranja","#fb8c00"],["Amarillo","#fdd835"],["Verde","#43a047"],["Azul","#1e88e5"],["Morado","#8e24aa"],["Rosa","#ec407a"],["Café","#6d4c41"],["Gris","#757575"],["Negro","#14161b"],["Blanco","#f2f2f2"]];const a=hexToRgb(h);let best=refs[0][0],bd=1e9;for(const r of refs){const b=hexToRgb(r[1]),d=(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2;if(d<bd){bd=d;best=r[0]}}return best}
async function imageRaster(url){const img=new Image();img.src=url;await img.decode();const sc=Math.min(1,220/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.max(16,Math.round(img.width*sc));c.height=Math.max(16,Math.round(img.height*sc));const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(img,0,0,c.width,c.height);return {w:c.width,h:c.height,d:x.getImageData(0,0,c.width,c.height).data};}
function foreground(r){const {w,h,d}=r,mask=new Uint8Array(w*h),bg=[];for(let x=0;x<w;x++){for(const y of [0,h-1]){const i=(y*w+x)*4;bg.push([d[i],d[i+1],d[i+2]])}}for(let y=0;y<h;y++){for(const x of [0,w-1]){const i=(y*w+x)*4;bg.push([d[i],d[i+1],d[i+2]])}}const av=bg.reduce((a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],[0,0,0]).map(v=>v/bg.length);for(let i=0;i<w*h;i++){const q=i*4,dist=Math.hypot(d[q]-av[0],d[q+1]-av[1],d[q+2]-av[2]);mask[i]=dist>32?1:0;}return {w,h,d,mask};}
function sample(v,u,yy){const x=Math.max(0,Math.min(v.w-1,Math.round(u*(v.w-1)))),y=Math.max(0,Math.min(v.h-1,Math.round((1-yy)*(v.h-1))));return v.mask[y*v.w+x]===1}
function sampleColor(v,u,yy){const x=Math.max(0,Math.min(v.w-1,Math.round(u*(v.w-1)))),y=Math.max(0,Math.min(v.h-1,Math.round((1-yy)*(v.h-1))));const i=(y*v.w+x)*4;return [v.d[i],v.d[i+1],v.d[i+2]]}
async function analyzePalette(){if(!S.images[0])return toast("Agrega una imagen primero.");const v=foreground(await imageRaster(S.images[0].url)),m=new Map();for(let y=0;y<v.h;y+=2)for(let x=0;x<v.w;x+=2){const k=y*v.w+x;if(!v.mask[k])continue;const i=k*4,h=rgbHex(v.d[i],v.d[i+1],v.d[i+2]);const q=h.slice(0,5);m.set(q,(m.get(q)||0)+1)}const top=[...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,+$("maxColors").value);S.palette=top.map(([k])=>({hex:k+"0",name:nearestName(k+"0")}));renderPalette();}
function renderPalette(){const b=$("palette");b.innerHTML="";for(const p of S.palette){const d=document.createElement("div");d.className="chip";d.innerHTML="<i style=\"background:"+p.hex+"\"></i><input value=\""+p.name+"\"><button>×</button>";d.querySelector("input").oninput=e=>p.name=e.target.value;d.querySelector("button").onclick=()=>{S.palette=S.palette.filter(x=>x!==p);renderPalette()};b.appendChild(d)}}
function setMode(mode){S.mode=mode;$$(".choice").forEach(x=>x.classList.toggle("active",x.dataset.mode===mode));$("multiBox").classList.toggle("hidden",mode!=="multi");if(mode==="multi"&&!S.palette.length&&S.images.length)analyzePalette();}

function voxelModel(views,n,depth,mode,pal){const occ=new Uint8Array(n*n*n), idx=(x,y,z)=>z*n*n+y*n+x;for(let z=0;z<n;z++)for(let y=0;y<n;y++)for(let x=0;x<n;x++){const u=x/(n-1),v=y/(n-1);let ok=views.f?sample(views.f,u,v):true;if(ok&&views.b)ok=sample(views.b,1-u,v);if(ok&&views.l)ok=sample(views.l,z/(n-1),v);if(ok&&views.r)ok=sample(views.r,1-z/(n-1),v);if(!views.l&&!views.r){const dx=(u-.5)/.48,rad=Math.sqrt(Math.max(0,1-dx*dx));if(Math.abs(z-(n-1)/2)>rad*n*.45)ok=false;}if(ok)occ[idx(x,y,z)]=1;}const groups=new Map(),add=(ci,a,b,c,d)=>{if(!groups.has(ci))groups.set(ci,[]);groups.get(ci).push([a,b,c,d])};for(let z=0;z<n;z++)for(let y=0;y<n;y++)for(let x=0;x<n;x++){const id=idx(x,y,z);if(!occ[id])continue;let ci=0;if(mode==="multi"&&pal&&pal.length){const rgb=views.f?sampleColor(views.f,(x+.5)/n,(y+.5)/n):[190,198,210];let bd=1e9;pal.forEach((p,i)=>{const c=hexToRgb(p.hex),d=(rgb[0]-c[0])**2+(rgb[1]-c[1])**2+(rgb[2]-c[2])**2;if(d<bd){bd=d;ci=i}})}const x0=x/n-.5,x1=(x+1)/n-.5,y0=y/n-.5,y1=(y+1)/n-.5,z0=z/n-.5,z1=(z+1)/n-.5;if(x===0||!occ[idx(x-1,y,z)])add(ci,[[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]);if(x===n-1||!occ[idx(x+1,y,z)])add(ci,[[x1,y0,z1],[x1,y1,z1],[x1,y1,z0],[x1,y0,z0]]);if(y===0||!occ[idx(x,y-1,z)])add(ci,[[x0,y0,z1],[x1,y0,z1],[x1,y0,z0],[x0,y0,z0]]);if(y===n-1||!occ[idx(x,y+1,z)])add(ci,[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]);if(z===0||!occ[idx(x,y,z-1)])add(ci,[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]]);if(z===n-1||!occ[idx(x,y,z+1)])add(ci,[[x0,y0,z1],[x0,y1,z1],[x1,y1,z1],[x1,y0,z1]])}const out=[];for(const [ci,faces] of groups){const pos=[];const ind=[];let k=0;for(const f of faces){for(const q of f)pos.push(q[0]*depth,q[1]*depth,q[2]*depth);ind.push(k,k+1,k+2,k,k+2,k+3);k+=4}out.push({positions:new Float32Array(pos),indices:new Uint32Array(ind),color:mode==="multi"&&pal[ci]?pal[ci].hex:"#b8c2d1"});}return out}
async function generate(){if(!S.images.length)return toast("Necesitas al menos una imagen.");modal("progressModal",true);$("progressTitle").textContent="PartForge Local";$("progressBar").style.width="10%";const vs=[];for(let i=0;i<S.images.length;i++){vs[i]=foreground(await imageRaster(S.images[i].url));$("progressMsg").textContent="Analizando vista "+(i+1)+" de "+S.images.length;await new Promise(r=>setTimeout(r,10))}$("progressBar").style.width="55%";const n=$("quality").value==="ultra"?46:$("quality").value==="high"?38:30;S.generated=voxelModel({f:vs[0],l:vs[1],b:vs[2],r:vs[3]},n,+$("heightMm").value,S.mode,S.palette.length?S.palette:[{hex:"#b8c2d1",name:"Principal"}]);$("progressBar").style.width="100%";$("genInfo").textContent="Modelo local creado: "+S.generated.length+" malla(s).";modal("progressModal",false);toast("Modelo creado sin IA externa.");}
function downloadBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function ensureThree(){if(S.three)return S.three;S.three=await import("https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js");S.Orbit=(await import("https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/controls/OrbitControls.js")).OrbitControls;return S.three}
function colorMat(c){return new S.three.MeshStandardMaterial({color:c||"#b8c2d1",roughness:.56,metalness:.03,side:S.three.DoubleSide})}
function geom(d){const g=new S.three.BufferGeometry();g.setAttribute("position",new S.three.BufferAttribute(d.positions,3));g.setIndex(new S.three.BufferAttribute(d.indices,1));g.computeVertexNormals();return g}
async function bootEditor(){const T=await ensureThree();if(S.renderer)return;const v=$("viewer");S.scene=new T.Scene();S.scene.background=new T.Color(0x080b10);S.camera=new T.PerspectiveCamera(45,1,.01,100000);S.camera.position.set(120,90,150);S.renderer=new T.WebGLRenderer({antialias:true});S.renderer.setPixelRatio(Math.min(devicePixelRatio,2));S.renderer.outputColorSpace=T.SRGBColorSpace;v.appendChild(S.renderer.domElement);S.controls=new S.Orbit(S.camera,S.renderer.domElement);S.controls.enableDamping=true;S.scene.add(new T.HemisphereLight(0xffffff,0x1a2130,2.2));const l=new T.DirectionalLight(0xffffff,3);l.position.set(100,180,120);S.scene.add(l);S.grid=new T.GridHelper(400,40,0x293345,0x161c28);S.scene.add(S.grid);S.overlay=new T.Group();S.scene.add(S.overlay);S.renderer.domElement.addEventListener("pointerdown",pointerDown);requestAnimationFrame(loop);resize()}
function loop(){if(S.renderer&&S.scene)S.renderer.render(S.scene,S.camera);if(S.controls)S.controls.update();requestAnimationFrame(loop)}
function resize(){if(!S.renderer)return;const r=$("viewer").getBoundingClientRect();S.camera.aspect=r.width/r.height;S.camera.updateProjectionMatrix();S.renderer.setSize(r.width,r.height,false)}
function clearScene(){for(const p of S.parts)S.scene.remove(p.mesh);S.parts=[];S.active=null;S.selected.clear();refreshParts()}
function loadGenerated(){if(!S.generated)return toast("Genera primero un modelo.");bootEditor().then(()=>{clearScene();for(let i=0;i<S.generated.length;i++){const d=S.generated[i],m=new S.three.Mesh(geom(d),colorMat(d.color));m.name=S.mode==="multi"?"Color "+(i+1):"Modelo";S.scene.add(m);S.parts.push({mesh:m,name:m.name})}setActive(S.parts[0]);frame();page("editor")})}
async function load3d(file){const ext=file.name.split(".").pop().toLowerCase();await bootEditor();clearScene();const U=URL.createObjectURL(file);try{let root=null;if(ext==="stl"){const L=(await import("https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/loaders/STLLoader.js")).STLLoader;root=new S.three.Mesh(new L().parse(await file.arrayBuffer()),colorMat())}else if(ext==="obj"){const L=(await import("https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/loaders/OBJLoader.js")).OBJLoader;root=new L().parse(await file.text());root.traverse(o=>{if(o.isMesh)o.material=colorMat()})}else if(ext==="glb"||ext==="gltf"){const L=(await import("https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/loaders/GLTFLoader.js")).GLTFLoader;root=(await new L().loadAsync(U)).scene;root.traverse(o=>{if(o.isMesh)o.material=colorMat()})}else throw new Error("Formato no compatible");S.scene.add(root);root.updateMatrixWorld(true);root.traverse(o=>{if(o.isMesh)S.parts.push({mesh:o,name:o.name||"Pieza "+(S.parts.length+1)})});setActive(S.parts[0]);frame();page("editor");toast("Modelo cargado: "+file.name)}finally{URL.revokeObjectURL(U)}}
function refreshParts(){const box=$("parts");box.innerHTML="";for(const p of S.parts){const b=document.createElement("button");b.className="part"+(p===S.active?" active":"");b.textContent=p.name;b.onclick=()=>setActive(p);box.appendChild(b)}$("meshInfo").textContent=S.parts.length+" pieza(s)"+(S.active?" · "+S.active.name:"")}
function setActive(p){S.active=p;if(p)$("partName").value=p.name;refreshParts()}
function frame(){if(!S.parts.length)return;const T=S.three,b=new T.Box3();S.parts.filter(p=>p.mesh.visible).forEach(p=>b.expandByObject(p.mesh));if(b.isEmpty())return;const c=b.getCenter(new T.Vector3()),s=b.getSize(new T.Vector3()),d=Math.max(s.x,s.y,s.z)*2.2;S.controls.target.copy(c);S.camera.position.copy(c).add(new T.Vector3(d,d*.7,d));S.controls.update()}
function rayPick(e){const r=S.renderer.domElement.getBoundingClientRect(),n=new S.three.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1),rc=new S.three.Raycaster();rc.setFromCamera(n,S.camera);const hits=rc.intersectObjects(S.parts.map(p=>p.mesh).filter(m=>m.visible),true);if(!hits.length)return null;let o=hits[0].object;while(o.parent&&!S.parts.some(p=>p.mesh===o))o=o.parent;const p=S.parts.find(x=>x.mesh===o);return p?{hit:hits[0],part:p,mesh:o,ndc:n}:null}
function triCount(m){return m.geometry.index?m.geometry.index.count/3:m.geometry.attributes.position.count/3}
function faceCenter(m,f){const g=m.geometry,p=g.attributes.position,i=g.index,ids=i?[i.getX(f*3),i.getX(f*3+1),i.getX(f*3+2)]:[f*3,f*3+1,f*3+2],T=S.three;const a=new T.Vector3().fromBufferAttribute(p,ids[0]),b=new T.Vector3().fromBufferAttribute(p,ids[1]),c=new T.Vector3().fromBufferAttribute(p,ids[2]);return a.add(b).add(c).multiplyScalar(1/3).applyMatrix4(m.matrixWorld)}
function faceNormal(m,f){const g=m.geometry,p=g.attributes.position,i=g.index,ids=i?[i.getX(f*3),i.getX(f*3+1),i.getX(f*3+2)]:[f*3,f*3+1,f*3+2],T=S.three;const a=new T.Vector3().fromBufferAttribute(p,ids[0]),b=new T.Vector3().fromBufferAttribute(p,ids[1]),c=new T.Vector3().fromBufferAttribute(p,ids[2]);return b.sub(a).cross(c.sub(a)).normalize().transformDirection(m.matrixWorld)}
function selectFaces(ctx){const m=ctx.mesh,n=triCount(m),out=new Set(),hit=ctx.hit.point;const baseN=faceNormal(m,ctx.hit.faceIndex);if(S.tool==="smart"){for(let f=0;f<n;f++)if(faceCenter(m,f).distanceTo(hit)<40&&baseN.dot(faceNormal(m,f))>Math.cos(S.angle*Math.PI/180))out.add(f)}else if(S.tool==="brush"){for(let f=0;f<n;f++)if(faceCenter(m,f).distanceTo(hit)<S.brush)out.add(f)}else if(S.tool==="color"){const mat=m.material?.color||new S.three.Color(.7,.7,.7);for(let f=0;f<n;f++){const c=mat;if(faceCenter(m,f).distanceTo(hit)<S.brush*1.7)out.add(f)}}else{for(let f=0;f<n;f++)if(faceCenter(m,f).distanceTo(hit)<25)out.add(f)}return out}
function highlight(){if(!S.overlay)return;S.overlay.clear();const T=S.three;for(const p of S.parts){const set=S.selected.get(p.mesh.uuid);if(!set?.size)continue;const g=p.mesh.geometry,pos=g.attributes.position,ix=g.index,a=[];for(const f of set){const ids=ix?[ix.getX(f*3),ix.getX(f*3+1),ix.getX(f*3+2)]:[f*3,f*3+1,f*3+2];for(const id of ids)a.push(pos.getX(id),pos.getY(id),pos.getZ(id))}const hg=new T.BufferGeometry();hg.setAttribute("position",new T.Float32BufferAttribute(a,3));hg.computeVertexNormals();const hm=new T.Mesh(hg,new T.MeshBasicMaterial({color:0x9b82ff,transparent:true,opacity:.55,side:T.DoubleSide,depthTest:false}));hm.applyMatrix4(p.mesh.matrixWorld);S.overlay.add(hm)}}
function applySel(mesh,set){const old=S.selected.get(mesh.uuid)||new Set();let n;if(S.addMode==="add")n=new Set([...old,...set]);else if(S.addMode==="subtract")n=new Set([...old].filter(x=>!set.has(x)));else n=set;S.selected.set(mesh.uuid,n);highlight()}
function pointerDown(e){const c=rayPick(e);if(!c)return;S.lastHit=c;if(S.tool==="object"){setActive(c.part);return}applySel(c.mesh,selectFaces(c))}
function geometryFromFaces(mesh,set){const T=S.three,g=mesh.geometry,p=g.attributes.position,ix=g.index,pos=[],ind=[];let k=0;for(const f of set){const ids=ix?[ix.getX(f*3),ix.getX(f*3+1),ix.getX(f*3+2)]:[f*3,f*3+1,f*3+2];for(const id of ids)pos.push(p.getX(id),p.getY(id),p.getZ(id));ind.push(k,k+1,k+2);k+=3}const ng=new T.BufferGeometry();ng.setAttribute("position",new T.Float32BufferAttribute(pos,3));ng.setIndex(ind);ng.computeVertexNormals();return ng}
function detach(){if(!S.active)return toast("Selecciona una pieza.");const set=S.selected.get(S.active.mesh.uuid);if(!set?.size)return toast("Selecciona una región.");const total=triCount(S.active.mesh),rest=new Set();for(let i=0;i<total;i++)if(!set.has(i))rest.add(i);if(!rest.size)return toast("La selección ocupa toda la pieza.");const base=new S.three.Mesh(geometryFromFaces(S.active.mesh,rest),colorMat("#b8c2d1")),piece=new S.three.Mesh(geometryFromFaces(S.active.mesh,set),colorMat(S.active.mesh.material?.color?.getHexString?("#"+S.active.mesh.material.color.getHexString()):"#8f82ff"));base.matrix.copy(S.active.mesh.matrix);piece.matrix.copy(S.active.mesh.matrix);base.matrixAutoUpdate=false;piece.matrixAutoUpdate=false;const idx=S.parts.indexOf(S.active),old=S.active;S.scene.remove(old.mesh);S.scene.add(base,piece);S.parts.splice(idx,1,{mesh:base,name:old.name+" base"},{mesh:piece,name:old.name+" separada"});S.selected.clear();setActive(S.parts[idx+1]);refreshParts();highlight();toast("Separación creada localmente.")}
function splitComponents(){if(!S.active)return;const m=S.active.mesh,n=triCount(m),mid=Math.floor(n/2),a=new Set(),b=new Set();for(let i=0;i<mid;i++)a.add(i);for(let i=mid;i<n;i++)b.add(i);S.selected.set(m.uuid,a);detach();toast("Se generó una separación local.")}
function cloneMaterial(m){return Array.isArray(m)?m.map(x=>x.clone()):m.clone()}
function makeJoint(){if(!S.active||S.parts.length<2||!S.lastHit)return toast("Necesitas dos piezas y un punto sobre la pieza activa.");const partner=S.parts.find(p=>p!==S.active&&p.mesh.visible);if(!partner)return toast("Muestra la segunda pieza.");const T=S.three,point=S.lastHit.hit.point.clone(),normal=faceNormal(S.active.mesh,S.lastHit.hit.faceIndex),size=+$("jointSize").value||4,depth=+$("jointDepth").value||3,gap=+$("jointGap").value||.15,type=$("joint").value;import("https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.18/build/index.module.js").then(({Brush,Evaluator,ADDITION,SUBTRACTION})=>{import("https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.15/build/index.module.js").then(()=>{const ab=new Brush(S.active.mesh.geometry.clone());ab.position.copy(S.active.mesh.position);ab.rotation.copy(S.active.mesh.rotation);ab.scale.copy(S.active.mesh.scale);ab.updateMatrixWorld(true);const pb=new Brush(partner.mesh.geometry.clone());pb.position.copy(partner.mesh.position);pb.rotation.copy(partner.mesh.rotation);pb.scale.copy(partner.mesh.scale);pb.updateMatrixWorld(true);const geo=type==="cube"?new T.BoxGeometry(size,size,depth*2):new T.CylinderGeometry(size/2,size/2,depth*2,32);const tool=new Brush(geo);tool.position.copy(point);tool.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),normal.clone().normalize());tool.position.add(normal.clone().multiplyScalar(depth/2));tool.updateMatrixWorld(true);const ev=new Evaluator();ev.useGroups=false;const male=ev.evaluate(ab,tool,ADDITION);if(type==="magnet"){male.material=cloneMaterial(S.active.mesh.material);const femaleTool=new Brush(new T.CylinderGeometry(size/2+gap,size/2+gap,depth,32));femaleTool.position.copy(point.clone().add(normal.clone().multiplyScalar(depth*1.6)));femaleTool.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),normal.clone().negate());femaleTool.updateMatrixWorld(true);const female=ev.evaluate(pb,femaleTool,SUBTRACTION);female.material=cloneMaterial(partner.mesh.material);replaceJoint(partner,female, S.active,male);toast("Alojamientos para imanes creados.")}else{const socketGeo=type==="cube"?new T.BoxGeometry(size+gap,size+gap,depth*2.2):new T.CylinderGeometry(size/2+gap,size/2+gap,depth*2.2,32);const socket=new Brush(socketGeo);socket.position.copy(point.clone().add(normal.clone().multiplyScalar(depth*1.4)));socket.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),normal.clone().negate());socket.updateMatrixWorld(true);const female=ev.evaluate(pb,socket,SUBTRACTION);female.material=cloneMaterial(partner.mesh.material);male.material=cloneMaterial(S.active.mesh.material);replaceJoint(partner,female,S.active,male);toast("Macho/hembra creado localmente.")}})})}
function replaceJoint(partner,female,active,male){S.scene.remove(partner.mesh,active.mesh);partner.mesh=female;active.mesh=male;S.scene.add(partner.mesh,active.mesh);refreshParts();frame()}
async function exportOne(format){if(!S.active)return toast("Selecciona una pieza.");if(format==="stl"){const E=(await import("https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/exporters/STLExporter.js")).STLExporter;downloadBlob(new Blob([new E().parse(S.active.mesh,{binary:true})],{type:"application/octet-stream"}),S.active.name+".stl")}else if(format==="obj"){const E=(await import("https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/exporters/OBJExporter.js")).OBJExporter;downloadBlob(new Blob([new E().parse(S.active.mesh)],{type:"text/plain"}),S.active.name+".obj")}else if(format==="3mf"){await export3MF()}}
async function export3MF(){const {zipSync,strToU8}=await import("https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js");let verts="",tris="",n=0;for(const p of S.parts){const g=p.mesh.geometry,pos=g.attributes.position,ix=g.index,start=n;for(let i=0;i<pos.count;i++){const v=new S.three.Vector3().fromBufferAttribute(pos,i).applyMatrix4(p.mesh.matrixWorld);verts+="<vertex x=\""+v.x.toFixed(4)+"\" y=\""+v.y.toFixed(4)+"\" z=\""+v.z.toFixed(4)+"\"/>";n++}for(let i=0;i<(ix?ix.count:pos.count);i+=3)tris+="<triangle v1=\""+(start+(ix?ix.getX(i):i))+"\" v2=\""+(start+(ix?ix.getX(i+1):i+1))+"\" v3=\""+(start+(ix?ix.getX(i+2):i+2))+"\"/>"}const xml="<?xml version=\"1.0\"?><model unit=\"millimeter\" xmlns=\"http://schemas.microsoft.com/3dmanufacturing/core/2015/02\"><resources><object id=\"1\" type=\"model\"><mesh><vertices>"+verts+"</vertices><triangles>"+tris+"</triangles></mesh></object></resources><build><item objectid=\"1\"/></build></model>";const rel="<?xml version=\"1.0\"?><Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\"><Relationship Target=\"/3D/3dmodel.model\" Id=\"rel0\" Type=\"http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel\"/></Relationships>";const types="<?xml version=\"1.0\"?><Types xmlns=\"http://schemas.openxmlformats.org/package/2006/content-types\"><Default Extension=\"rels\" ContentType=\"application/vnd.openxmlformats-package.relationships+xml\"/><Default Extension=\"model\" ContentType=\"application/vnd.ms-package.3dmanufacturing-3dmodel+xml\"/></Types>";downloadBlob(new Blob([zipSync({"[Content_Types].xml":strToU8(types),"_rels/.rels":strToU8(rel),"3D/3dmodel.model":strToU8(xml)},{level:6})],{type:"application/vnd.ms-package.3dmanufacturing-3dmodel+xml"}),"partforge.3mf")}
