name: Publish PartForge Local Free
on:
  push:
    paths:
      - "partforge/_build/READY"
      - ".github/workflows/assemble-partforge-local.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write PartForge Local files
        shell: bash
        run: |
          cat > partforge/index.html <<'EOF_INDEX'
