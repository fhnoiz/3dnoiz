function view(axis){if(!S.parts.length)return;const T=S.three,b=new T.Box3();S.parts.forEach(p=>b.expandByObject(p.mesh));const c=b.getCenter(new T.Vector3()),s=b.getSize(new T.Vector3()),d=Math.max(s.x,s.y,s.z)*2;const v=axis==="front"?new T.Vector3(0,0,1):axis==="top"?new T.Vector3(0,1,0):new T.Vector3(1,0,0);S.camera.position.copy(c).add(v.multiplyScalar(d));S.controls.target.copy(c);S.controls.update()}
